<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" font-family="'Segoe UI', Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#052e2b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <text x="80" y="150" font-size="80" font-weight="800" fill="url(#title)" letter-spacing="-1">Auto Clicker</text>
  <text x="84" y="196" font-size="24" fill="#cbd5e1">Clics automatiques pour Windows : bureau <tspan fill="#86efac">et</tspan> jeux</text>

  <g font-size="15" font-weight="600">
    <g transform="translate(84 226)"><rect width="128" height="30" rx="15" fill="#0b1220" stroke="#38bdf8" stroke-opacity=".6"/><text x="64" y="20" text-anchor="middle" fill="#7dd3fc">PowerShell</text></g>
    <g transform="translate(222 226)"><rect width="136" height="30" rx="15" fill="#0b1220" stroke="#a78bfa" stroke-opacity=".6"/><text x="68" y="20" text-anchor="middle" fill="#c4b5fd">WinForms UI</text></g>
    <g transform="translate(368 226)"><rect width="118" height="30" rx="15" fill="#0b1220" stroke="#facc15" stroke-opacity=".6"/><text x="59" y="20" text-anchor="middle" fill="#fde047">SendInput</text></g>
    <g transform="translate(496 226)"><rect width="126" height="30" rx="15" fill="#0b1220" stroke="#22c55e" stroke-opacity=".6"/><text x="63" y="20" text-anchor="middle" fill="#86efac">Interception</text></g>
  </g>
  <text x="84" y="296" font-size="16" fill="#64748b">Zéro installation · raccourci global F6 · gauche / droit / milieu</text>

  <!-- target + cursor with ripple -->
  <g transform="translate(1000 180)">
    <circle r="110" fill="none" stroke="#22c55e" stroke-opacity=".12" stroke-width="2"/>
    <circle r="70" fill="none" stroke="#22c55e" stroke-opacity=".18" stroke-width="2"/>
    <circle r="10" fill="#22c55e" fill-opacity=".9"/>
    <circle r="10" fill="none" stroke="#86efac" stroke-width="3">
      <animate attributeName="r" values="10;90" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="1;0" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle r="10" fill="none" stroke="#86efac" stroke-width="3">
      <animate attributeName="r" values="10;90" dur="0.9s" begin="0.45s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="1;0" dur="0.9s" begin="0.45s" repeatCount="indefinite"/>
    </circle>
    <!-- cursor -->
    <g transform="translate(4 4)">
      <path d="M0 0 L0 56 L14 43 L24 66 L33 62 L23 40 L41 40 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="3" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="translate" values="0 0;2 2;0 0" dur="0.45s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- CPS counter -->
    <g transform="translate(-60 118)">
      <rect width="120" height="34" rx="17" fill="#052e2b" stroke="#22c55e"/>
      <text x="60" y="23" text-anchor="middle" font-size="16" font-weight="700" fill="#86efac">10 clics/s</text>
    </g>
  </g>
</svg>
